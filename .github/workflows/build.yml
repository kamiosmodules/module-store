name: Build module store

on:
  push:
    branches: [main]
    paths: ["modules/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the builder dates each module from its git history

      - name: Zip modules and build modules.json
        run: python3 scripts/build.py

      - name: Publish zips to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest modules
          files: out/*.zip

      - name: Commit updated index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add modules.json
          git diff --cached --quiet || (git commit -m "Update modules.json" && git push)
