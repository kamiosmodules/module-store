<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<title>Module Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14181f;--mute:#5d6675;--line:#e1e5ec;--acc:#3b5bdb;--acc-ink:#fff;--tile:#e4e9ff;--tile-ink:#2c46b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#181c26;--ink:#eef1f7;--mute:#98a2b5;--line:#272d3b;--acc:#7c93ff;--acc-ink:#0d1230;--tile:#232a4a;--tile-ink:#b6c3ff}}
:root[data-theme="dark"]{--bg:#10131a;--card:#181c26;--ink:#eef1f7;--mute:#98a2b5;--line:#272d3b;--acc:#7c93ff;--acc-ink:#0d1230;--tile:#232a4a;--tile-ink:#b6c3ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px max(14px,env(safe-area-inset-right,0px)) 48px max(14px,env(safe-area-inset-left,0px))}
h1{font-size:32px;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.support{margin:0 0 10px;font-size:13px}
.support a{color:var(--acc);text-decoration:none;font-weight:500}
.support a:hover{text-decoration:underline}
.support a:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.sub{color:var(--mute);margin:0 0 20px}
.search{width:100%;min-height:48px;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
.search:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tile{width:44px;height:44px;overflow:hidden;border-radius:12px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;overflow-wrap:anywhere}
.shots{grid-column:1 / -1;grid-row:2;display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.shots img{height:170px;width:auto;border-radius:12px;flex:none;border:1px solid var(--line);cursor:zoom-in}
.shots img:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;cursor:zoom-out;background:#000}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:24px;width:48px;height:48px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.lb button:focus-visible{outline:3px solid #fff}
.lb .x{top:max(12px,env(safe-area-inset-top,0px));right:12px}
.lb .p{left:10px;top:50%;margin-top:-24px}
.lb .n{right:10px;top:50%;margin-top:-24px}
.lb .c{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;opacity:.85}
.name{font-weight:700;margin:0}
.meta{color:var(--mute);font-size:13px;margin:0 0 2px}
.desc{margin:0;color:var(--ink);font-size:15px}
.btn{grid-column:3;grid-row:1;align-self:center;display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:700;font-size:15px;padding:0 20px;border-radius:999px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.empty{padding:28px 16px;color:var(--mute);text-align:center}
.note{font-size:13px;color:var(--mute);margin:14px 4px}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:500}
pre{overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;margin:10px 0 0;color:var(--mute)}
@media (max-width:560px){h1{font-size:28px}.row{grid-template-columns:44px minmax(0,1fr);padding:14px}.btn{grid-column:1 / -1;grid-row:3;width:100%;margin-top:10px}summary{padding:4px 0}}
</style>
</head>
<body>
<main>
  <h1>Module Store</h1>
  <p class="support"><a href="https://t.me/kamiosofficial" target="_blank" rel="noopener">Official support group for KamiOS</a></p>
  <p class="sub">Browse modules and download the zip in one tap.</p>
  <input id="q" class="search" type="search" placeholder="Search modules" aria-label="Search modules">
  <div id="list" class="list" aria-live="polite"></div>
  <p class="note" id="src"></p>
  <details>
    <summary>See the modules.json behind this page</summary>
    <pre id="json"></pre>
  </details>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
  <button class="x" id="lbx" aria-label="Close">&#10005;</button>
  <button class="p" id="lbp" aria-label="Previous screenshot">&#8249;</button>
  <img id="lbi" alt="">
  <button class="n" id="lbn" aria-label="Next screenshot">&#8250;</button>
  <div class="c" id="lbc"></div>
</div>
<script>
// Sample data. On GitHub Pages this is replaced by the real modules.json next to index.html.
var SAMPLE = {
  updated: "2026-10-12",
  modules: [
    {id:"better-battery",name:"Better Battery",version:"1.2",author:"shoaib",description:"Tunes kernel and doze settings to cut idle drain.",download:"https://github.com/USER/module-store/releases/download/latest/better-battery.zip"},
    {id:"fast-charge-tweaks",name:"Fast Charge Tweaks",version:"0.9",author:"devname",description:"Raises the charge current limit on supported devices.",download:"https://github.com/USER/module-store/releases/download/latest/fast-charge-tweaks.zip"},
    {id:"dark-everything",name:"Dark Everything",version:"2.0",author:"devname",description:"Forces dark mode on apps that do not support it.",download:"https://github.com/USER/module-store/releases/download/latest/dark-everything.zip"},
    {id:"debloat-lite",name:"Debloat Lite",version:"1.0",author:"shoaib",description:"Disables a safe list of preinstalled apps without deleting them.",download:"https://github.com/USER/module-store/releases/download/latest/debloat-lite.zip"},
    {id:"gaming-boost",name:"Gaming Boost",version:"1.5",author:"someone",description:"Locks the CPU and GPU governors to performance while a game is open.",download:"https://github.com/USER/module-store/releases/download/latest/gaming-boost.zip"}
  ]
};
var shown = [], data = SAMPLE, listEl = document.getElementById('list'), q = document.getElementById('q');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  var t = q.value.trim().toLowerCase();
  var items = data.modules.filter(function(m){return (m.name+' '+m.description+' '+m.author).toLowerCase().indexOf(t)>-1});
  if(!items.length){listEl.innerHTML='<div class="empty">No modules match "'+esc(q.value)+'". Try a different word.</div>';return}
  shown = items;
  listEl.innerHTML = items.map(function(m,mi){
    var tile = m.thumbnail ? '<img src="'+esc(m.thumbnail)+'" alt="" loading="lazy">' : esc(m.name.charAt(0));
    var shots = (m.screenshots&&m.screenshots.length) ? '<div class="shots">'+m.screenshots.map(function(u,si){return '<img src="'+esc(u)+'" alt="Screenshot of '+esc(m.name)+'" loading="lazy" tabindex="0" role="button" data-m="'+mi+'" data-i="'+si+'">'}).join('')+'</div>' : '';
    return '<div class="row"><div class="tile">'+tile+'</div>'+
      '<div class="info"><p class="name">'+esc(m.name)+'</p>'+
      '<p class="meta">v'+esc(m.version)+' by '+esc(m.author)+'</p>'+
      '<p class="desc">'+esc(m.description)+'</p></div>'+shots+
      '<a class="btn" href="'+esc(m.download)+'" target="_blank" rel="noopener" download>Download</a></div>';
  }).join('');
}
function show(src){
  document.getElementById('src').textContent = src;
  document.getElementById('json').textContent = JSON.stringify(data,null,2);
  render();
}
q.addEventListener('input',render);

// Screenshot viewer: tap a screenshot to open it full size.
var lb=document.getElementById('lb'), lbi=document.getElementById('lbi'), lbc=document.getElementById('lbc');
var cur={list:[],i:0,name:''}, lastFocus=null;
function lbShow(){
  lbi.src=cur.list[cur.i]; lbi.alt='Screenshot of '+cur.name;
  lbc.textContent=cur.name+' ('+(cur.i+1)+' of '+cur.list.length+')';
  var multi=cur.list.length>1;
  document.getElementById('lbp').style.display=multi?'grid':'none';
  document.getElementById('lbn').style.display=multi?'grid':'none';
}
function lbOpen(mi,si){
  var m=shown[mi]; if(!m||!m.screenshots) return;
  cur={list:m.screenshots,i:si,name:m.name}; lastFocus=document.activeElement;
  lbShow(); lb.classList.add('open'); document.body.style.overflow='hidden';
  document.getElementById('lbx').focus();
}
function lbClose(){lb.classList.remove('open'); lbi.removeAttribute('src'); document.body.style.overflow=''; if(lastFocus&&lastFocus.focus) lastFocus.focus()}
function lbStep(d){cur.i=(cur.i+d+cur.list.length)%cur.list.length; lbShow()}
function openFrom(t){var e=t.closest&&t.closest('.shots img'); if(e){lbOpen(+e.getAttribute('data-m'),+e.getAttribute('data-i')); return true}}
listEl.addEventListener('click',function(e){openFrom(e.target)});
listEl.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&openFrom(e.target)) e.preventDefault()});
document.getElementById('lbx').addEventListener('click',lbClose);
document.getElementById('lbp').addEventListener('click',function(e){e.stopPropagation();lbStep(-1)});
document.getElementById('lbn').addEventListener('click',function(e){e.stopPropagation();lbStep(1)});
lbi.addEventListener('click',lbClose);
lb.addEventListener('click',function(e){if(e.target===lb) lbClose()});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') lbClose();
  else if(e.key==='ArrowLeft'&&cur.list.length>1) lbStep(-1);
  else if(e.key==='ArrowRight'&&cur.list.length>1) lbStep(1);
});
// Swipe left/right on the open image to move between screenshots.
var tx=null;
lb.addEventListener('touchstart',function(e){tx=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
lb.addEventListener('touchend',function(e){
  if(tx===null||cur.list.length<2) return;
  var dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>60) lbStep(dx<0?1:-1);
},{passive:true});
// Try the real file first (works on GitHub Pages), otherwise keep the sample.
fetch('modules.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  if(j&&j.modules){data=j;show('Loaded modules.json from this site.')}else throw 0;
}).catch(function(){show('Showing sample data. Download links point to a placeholder repo (USER/module-store).')});
</script>
</body>
</html>
